spring.application.name=booking

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=50

spring.flyway.enabled=true

logging.level.com.airline.booking=INFO

# HS256 signing key for login-issued JWTs (see JwtService). Override via APP_JWT_SECRET in any
# real deployment - this default is fine for local/demo use only. Must be >= 32 bytes (UTF-8).
app.jwt.secret=change-this-demo-only-jwt-signing-secret-32bytes-min
app.jwt.expiration-minutes=60
